<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Sophisticated dark-green gradient -->
    <linearGradient id="cbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006B4A" />
      <stop offset="50%" stop-color="#008F5A" />
      <stop offset="100%" stop-color="#00A86B" />
    </linearGradient>

    <!-- Subtle drop shadow for the white square card -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.03" />
    </filter>

    <!-- Mask to carve out the bar chart and the business growth line using negative space -->
    <mask id="chartMask">
      <!-- Everything white remains visible -->
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF" />
      
      <!-- Black shapes will carve out negative space -->
      <!-- Three ascending bars of the chart -->
      <rect x="276" y="310" width="10" height="85" rx="2" fill="#000000" />
      <rect x="295" y="290" width="10" height="105" rx="2" fill="#000000" />
      <rect x="314" y="270" width="10" height="125" rx="2" fill="#000000" />
      
      <!-- Diagonal upward growth arrow connecting the bars -->
      <path d="M 258 328 L 340 246 M 340 246 L 328 246 M 340 246 L 340 258" 
            stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </mask>
  </defs>

  <!-- Ground Plane representing transparent or off-white workspace -->
  
  <!-- Rounded-square app icon card -->
  <rect x="64" y="64" width="384" height="384" rx="88" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Monogram symbol connecting 'C' and 'B' with sophisticated gradient and negative-space mask -->
  <path d="M 285 140 A 116 116 0 0 0 285 372 A 58 58 0 0 0 285 256 A 58 58 0 0 0 285 140 Z" 
        fill="none" stroke="url(#cbGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"
        mask="url(#chartMask)" />
</svg>
